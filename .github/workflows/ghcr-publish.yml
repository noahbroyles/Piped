name: Publish to GHCR

# Builds the frontend and publishes a multi-architecture image to ghcr.io/<owner>/piped-frontend, using only the built in GITHUB_TOKEN (no secrets to configure).
on:
    push:
        paths-ignore:
            - "**.md"
        branches:
            - master
    # Allows publishing by hand from the Actions tab.
    workflow_dispatch:

# A newer run replaces an older one, so that the latest tag cannot end up pointing at an older build.
concurrency:
    group: ghcr-publish-${{ github.ref }}
    cancel-in-progress: true

# The default token is read only, so the publish job below asks for packages: write on its own.
permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: latest
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  cache: "pnpm"
            - run: pnpm install
            # Dockerfile.ci copies the prebuilt site from dist-ci/, as the upstream Docker Hub workflow did.
            - run: pnpm build && ./localizefonts.sh && mv dist/ dist-ci/
            # The image is named piped-frontend (like upstream's 1337kavin/piped-frontend) rather than after the
            # repository. GHCR rejects uppercase letters in image names, and the owner may have them.
            - name: Compute image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/piped-frontend" >> "$GITHUB_OUTPUT"
            # Dockerfile.ci has no RUN steps (it only copies files onto a multi-arch nginx image), so
            # Buildx can produce both architectures without QEMU emulation.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Tags the image with latest (default branch only) and with the commit, such as sha-1a2b3c4.
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile.ci
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
